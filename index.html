<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yakunex Technologies — Intern Verification</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #111111;
      color: #111111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .card {
      width: 100%;
      max-width: 390px;
      background: #ffffff;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.45);
      border: 1px solid #e6c86e;
    }
    .header {
      background: linear-gradient(135deg, #141414 0%, #262216 100%);
      color: #ffffff;
      text-align: center;
      padding: 22px 18px;
      border-bottom: 3px solid #d4af37;
    }
    .header img {
      width: 74px;
      height: 74px;
      object-fit: contain;
      background: #ffffff;
      border-radius: 14px;
      padding: 6px;
      margin-bottom: 10px;
    }
    .company {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      color: #f5d061;
    }
    .tagline {
      margin: 4px 0 0;
      font-size: 12px;
      color: #dddddd;
      letter-spacing: 0.5px;
    }
    .body {
      padding: 20px;
    }
    .name {
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 4px;
    }
    .role {
      text-align: center;
      font-size: 14px;
      color: #555555;
      margin-bottom: 14px;
    }
    .badge-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 18px;
    }
    .badge {
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }
    .active {
      background: #e6f7ed;
      color: #137333;
      border: 1px solid #a8dab5;
    }
    .inactive {
      background: #fce8e6;
      color: #c5221f;
      border: 1px solid #f6aea9;
    }
    .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 0;
      border-bottom: 1px solid #eeeeee;
      font-size: 13px;
    }
    .row:last-child {
      border-bottom: none;
    }
    .label {
      color: #666666;
      font-weight: 600;
      white-space: nowrap;
    }
    .val {
      color: #111111;
      text-align: right;
      word-break: break-word;
      font-weight: 500;
    }
    .footer {
      background: #141414;
      color: #bbbbbb;
      text-align: center;
      font-size: 11px;
      padding: 12px;
    }
    .error-box {
      padding: 28px 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card" id="app"></div>

  <script>
    const INTERNS = {
      "YNX-INT-001": {

        validPeriod: "2026.10.26 - 2027.04.25",
        phone: "+94 71 559 2649",
        email: "bimsarachanu@gmail.com"
      },
      "YNX-INT-002": {
        id: "YNX-INT-002",
        name: "M.R.F. Siraja",
        role: "Trainee Intern",
        department: "Development",
        status: "Active",
        validPeriod: "2026.10.26 - 2027.04.25",
        phone: "+94 77 669 0981",
        email: "fathimasiraja20@gmail.com"
      },
      "YNX-INT-003": {

        status: "Active",
        validPeriod: "2026.10.26 - 2027.04.25",
        phone: "+94 72 687 0867",
        email: "udara7355@gmail.com"
      },
      "YNX-INT-004": {
        id: "YNX-INT-004",
        name: "H.M.C.D.M. Hitihamu",

        status: "Active",
        validPeriod: "2026.10.26 - 2027.04.25",
        phone: "+94 74 283 6771",
        email: "chamudunihitihamu1204@gmail.com"
      },
      "YNX-INT-005": {

        department: "Development",
        status: "Active",
        validPeriod: "2026.10.26 - 2027.04.25",
        phone: "+94 77 785 1550",
        email: "zainabmr46@gmail.com"
      },
      "YNX-INT-006": {
        id: "YNX-INT-006",
        name: "P.A.S.V.R.K. Prabhashwara",
        role: "Trainee Intern",
        department: "Development",
        status: "Active",
        validPeriod: "2026.10.26 - 2027.04.25",
        phone: "+94 76 325 3961",
        email: "rashankawishka@gmail.com"
      }
    };

    const params = new URLSearchParams(window.location.search);
    const idParam = (params.get("id") || "").toUpperCase().trim();
    const person = INTERNS[idParam];
    const app = document.getElementById("app");

    if (!person) {
      app.innerHTML = `
        <div class="header">
          <img src="logo.png" alt="Yakunex Logo" onerror="this.style.display='none'" />
          <h1 class="company">Yakunex Technologies (Pvt) Ltd</h1>
          <p class="tagline">Innovate • Build • Grow</p>
        </div>
        <div class="error-box">
          <h3>Invalid or Missing ID</h3>
          <p>Please scan a valid Yakunex ID card QR code.</p>
        </div>
        <div class="footer">yakunextechnologies.com</div>
      `;
    } else {
      const isActive = person.status.toLowerCase() === "active";
      app.innerHTML = `
        <div class="header">
          <img src="logo.png" alt="Yakunex Logo" onerror="this.style.display='none'" />
          <h1 class="company">Yakunex Technologies (Pvt) Ltd</h1>
          <p class="tagline">Innovate • Build • Grow</p>
        </div>
        <div class="body">
          <h2 class="name">${person.name}</h2>
          <div class="role">${person.role} • ${person.department}</div>
          <div class="badge-wrap">
            <span class="badge ${isActive ? "active" : "inactive"}">
              ${isActive ? "● ACTIVE" : "● INACTIVE"}
            </span>
          </div>
          <div class="row"><span class="label">Employee ID</span><span class="val">${person.id}</span></div>
          <div class="row"><span class="label">Valid Period</span><span class="val">${person.validPeriod}</span></div>
          <div class="row"><span class="label">Phone</span><span class="val"><a href="tel:${person.phone.replace(/\s+/g, "")}" style="color:inherit;text-decoration:none;">${person.phone}</a></span></div>
          <div class="row"><span class="label">Email</span><span class="val"><a href="mailto:${person.email}" style="color:inherit;text-decoration:none;">${person.email}</a></span></div>
        </div>
        <div class="footer">Yakunex Technologies (Pvt) Ltd • Official ID Verification</div>
      `;
    }
  </script>
</body>
</html>
